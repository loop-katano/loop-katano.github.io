name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:pages
      - name: Normalize Vite entry and add SPA route fallback
        run: |
          mv dist/client/app/index.html dist/client/index.html
          rmdir dist/client/app
          cp dist/client/index.html dist/client/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify rendered homepage
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..10}; do
            if curl -fsSL "$PAGE_URL" | grep -q "/assets/"; then
              break
            fi
            sleep 5
          done
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "$PAGE_URL" > rendered.html
          grep -q "AI 招聘情报中心" rendered.html
          grep -q "Football Data Lab" rendered.html
